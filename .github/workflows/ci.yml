name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}, VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Latest stable and the minimum version from 'engines.vscode'
        vscode: [stable, 1.90.0]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VS Code needs a display, Linux runners don't have one
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run tests
        if: runner.os != 'Linux'
        run: npm test

  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
